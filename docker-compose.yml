

services:

  db:
    image: postgres:16.4 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - manPerso_volume:/var/lib/postgresql/data
    ports:
      - "9898:5432"
  
volumes:
  manPerso_volume:

